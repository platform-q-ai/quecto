[package]
name = "quecto-agentic-harness"
version = "0.107.177"
edition = "2024"
description = "Ultra-lightweight personal AI assistant"
license = "LicenseRef-Proprietary"

[lib]
name = "quecto"
path = "src/lib.rs"

[[bin]]
name = "quecto"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "io-std", "sync"] }

# Shared bounded protocol reader (#1003)
quecto-line-io = { version = "0.2.1", path = "../quecto-line-io" }
quecto-fail-fast = { version = "0.1.0", path = "../quecto-fail-fast" }

# HTTP-date parsing (already present transitively through hyper).
httpdate = "1.0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }

# Shortest round-trip float digits for the swarm board's Python-compatible
# JSON codec (#2268). Already in the tree (serde_urlencoded, via reqwest);
# unlike std's `{:e}`, it breaks an exact tie between two shortest digit
# strings to even, as Python's `repr` does.
ryu = "1"

# The swarm board's SQLite driver (#2269): the same file format the Python
# board writes. `bundled` compiles SQLite itself, so no system libsqlite3 is
# needed; `limits` reads the variable limit the store checks on open.
rusqlite = { version = "0.40", features = ["bundled", "limits"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
humantime = "2"
futures = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dirs = "6"
tempfile = "3"
thiserror = "2"
similar = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
urlencoding = "2"
# Secret redaction in surfaced subagent error causes (#752). Already present
# transitively via tracing-subscriber's env-filter.
regex = "1"

# Direct process-group signalling on abort (#895). Already in the tree
# transitively; promoted to a direct dep so the abort reaper can SIGKILL a
# child's whole process group via a syscall rather than a non-portable shell
# `kill` (dash and bash parse `kill -- -<pgid>` differently).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[features]
default = []
test-support = []

[dev-dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
# The architecture scanners render production tokens after stripping
# `#[cfg(test)]` items (#1637).
# `span-locations`: line numbers for the test-only item ranges.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
cucumber = "0.21"
futures = "0.3"
# `test-util` enables the paused-clock tests (`#[tokio::test(start_paused = true)]`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
wiremock = "0.6"
# Builds a `reqwest::Response` whose body arrives as one chunk, to test the
# SSE pumps against a chunk boundary no server can be relied on to keep.
http = "1"
regex = "1"
filetime = "0.2"
serial_test = "3"
rcgen = "0.13"
tokio-rustls = "0.26"
# `test-harness` exposes quecto-tui's headless render harness so the `bdd`
# target can drive the real TUI render/key path without a TTY (#805).
quecto-tui = { version = "0.77.3", path = "../quecto-tui", features = ["test-harness"] }

# Integration tests are consolidated into a few targets (tests/integration/main.rs,
# tests/docs/main.rs, plus architecture, contracts, bdd, parent_loss and the
# one below): every `tests/*.rs` file is its own binary linking the whole
# harness, so 36 of them made a one-file edit relink 36 executables.
#
# The real-process selected-termination proof stays its own binary: it sets
# process-wide environment (`QUECTO_TEST_HOLD_EXIT_AFTER_ACK`, `QUECTO_BASE_DIR`,
# `QUECTO_CHILD_BINARY`) that every `quecto` child spawned by a concurrently
# running test would inherit. It launches the `quecto` binary with the
# `test-support` hold gate, which a production build does not compile in.
[[test]]
name = "selected_termination"
required-features = ["test-support"]

# These targets reach test-only surface gated behind `test-support` (e.g.
# `test_support::executable::write_executable`, #2232). Without the feature
# a plain `cargo test` SKIPS them silently; an explicit `--test <name>` is
# refused with "requires the features: test-support" (rather than a wall of
# "not found" errors). CI and the local gates always pass the feature, so
# pass `--features test-support` too, or these targets do not run.
[[test]]
name = "contracts"
required-features = ["test-support"]

[[test]]
name = "integration"
required-features = ["test-support"]

[[test]]
name = "docs"
required-features = ["test-support"]

[[test]]
name = "parent_loss"
required-features = ["test-support"]

[[test]]
name = "bdd"
harness = false
# BDD steps reach into test-only surface (e.g. `*_public`, `parse_args_for_test`,
# `run_repl_with_tty_captured`, `ReplRecorderOptions`) that is gated behind
# `#[cfg(any(test, feature = "test-support"))]`. Without the feature, building
# `cargo test --test bdd` would fail with 40+ "function not found" errors because
# the integration-test target is a separate crate compilation that doesn't
# inherit the unit-test `#[cfg(test)]`. `required-features` does NOT turn the
# feature on: without `--features test-support` a plain `cargo test` skips
# this target silently, and `--test bdd` is refused with a message naming
# the feature.
required-features = ["test-support"]

# The board op telemetry overhead probe (#2303): opt-in and re-runnable,
# never part of a test run. `cargo run --release --features test-support
# --example board_op_overhead` prints p50/p95 per op with the event log off
# and on.
[[example]]
name = "board_op_overhead"
required-features = ["test-support"]
