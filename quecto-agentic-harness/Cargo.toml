[package]
name = "quecto-agentic-harness"
version = "0.107.87"
edition = "2024"
description = "Ultra-lightweight personal AI assistant"
license = "LicenseRef-Proprietary"

[lib]
name = "quecto"
path = "src/lib.rs"

[[bin]]
name = "quecto"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "io-std", "sync"] }

# Shared bounded protocol reader (#1003)
quecto-line-io = { version = "0.2.1", path = "../quecto-line-io" }

# HTTP-date parsing (already present transitively through hyper).
httpdate = "1.0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
humantime = "2"
futures = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dirs = "6"
tempfile = "3"
thiserror = "2"
similar = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
urlencoding = "2"
# Secret redaction in surfaced subagent error causes (#752). Already present
# transitively via tracing-subscriber's env-filter.
regex = "1"

# Direct process-group signalling on abort (#895). Already in the tree
# transitively; promoted to a direct dep so the abort reaper can SIGKILL a
# child's whole process group via a syscall rather than a non-portable shell
# `kill` (dash and bash parse `kill -- -<pgid>` differently).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[features]
default = []
test-support = []

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
cucumber = "0.21"
futures = "0.3"
# `test-util` enables the paused-clock tests (`#[tokio::test(start_paused = true)]`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
wiremock = "0.6"
regex = "1"
filetime = "0.2"
serial_test = "3"
rcgen = "0.13"
tokio-rustls = "0.26"
# `test-harness` exposes quecto-tui's headless render harness so the `bdd`
# target can drive the real TUI render/key path without a TTY (#805).
quecto-tui = { version = "0.77.3", path = "../quecto-tui", features = ["test-harness"] }

# Integration tests are consolidated into a few targets (tests/integration/main.rs,
# tests/docs/main.rs, plus architecture, contracts, bdd, parent_loss and the
# one below): every `tests/*.rs` file is its own binary linking the whole
# harness, so 36 of them made a one-file edit relink 36 executables.
#
# The real-process selected-termination proof stays its own binary: it sets
# process-wide environment (`QUECTO_TEST_HOLD_EXIT_AFTER_ACK`, `QUECTO_BASE_DIR`,
# `QUECTO_CHILD_BINARY`) that every `quecto` child spawned by a concurrently
# running test would inherit. It launches the `quecto` binary with the
# `test-support` hold gate, which a production build does not compile in.
[[test]]
name = "selected_termination"
required-features = ["test-support"]

[[test]]
name = "bdd"
harness = false
# BDD steps reach into test-only surface (e.g. `*_public`, `parse_args_for_test`,
# `run_repl_with_tty_captured`, `ReplRecorderOptions`) that is gated behind
# `#[cfg(any(test, feature = "test-support"))]`. Without this line, invoking
# `cargo test --test bdd` fails with 40+ "function not found" errors because
# the integration-test target is a separate crate compilation that doesn't
# inherit the unit-test `#[cfg(test)]`. `required-features` makes cargo pull
# the feature in automatically whenever the bdd target is built.
required-features = ["test-support"]
