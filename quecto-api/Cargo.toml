[package]
name = "quecto-api"
version = "0.5.3"
edition = "2024"
description = "HTTP/WebSocket gateway to a quecto agent over UDS"
license = "LicenseRef-Proprietary"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "io-util"] }

# Shared bounded protocol reader (#1003)
quecto-line-io = { version = "0.2.1", path = "../quecto-line-io" }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cucumber = { version = "0.21", features = ["macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"

[[test]]
name = "bdd"
harness = false
