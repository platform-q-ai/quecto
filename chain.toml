  # Engineering hygiene / meta-features
  "tests/features/architecture.feature",
  "tests/features/release_profile.feature",
  "tests/features/repo_docs.feature",
  "tests/features/sandbox_hardening.feature",

  # TUI widgets for subagents — presentational
  "tests/features/subagent_widget.feature",

  # Tool-port features: exercise a Tool trait implementation, not a domain
  # noun. Tool is a port; its behaviour is contract-tested per adapter.
  "tests/features/find.feature",
  "tests/features/grep.feature",
  "tests/features/ls.feature",
  "tests/features/spawn_tool.feature",
  "tests/features/ensure_tool.feature",
  "tests/features/nsjail_exec.feature",
  "tests/features/truncate.feature",
  "tests/features/path_utils.feature",

  # CLI / config / auth plumbing — invoke the system but exercise no single
  # domain noun directly; their behaviour is driven by composition, not by
  # a feature-visible aggregate.
  "tests/features/cli.feature",
  "tests/features/config.feature",
  "tests/features/auth.feature",
  "tests/features/agent_cli.feature",
  "tests/features/security.feature",
  "tests/features/extensions.feature",

  # Subagent orchestration — tracked nouns (AgentInfo, AgentResult,
  # AgentProgressEvent) are untracked_nouns per the design: internal
  # orchestration types, not feature-visible aggregates.
  "tests/features/subagent.feature",
  "tests/features/subagent_monitor.feature",
  "tests/features/subagent_protocol.feature",
  "tests/features/agent_cmd_await.feature",
  "tests/features/abort_double_fire.feature",

  # E2E harness features — they compose the whole stack; per-noun tags
