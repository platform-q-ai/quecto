# ────────────────────────────────────────────────────────────────────────────
# Domain nouns that are intentionally internal: shared errors, value
# sub-objects of a tracked aggregate, provider-protocol DTOs, workflow
# engine internals. They have no business appearing in Gherkin prose.
# ────────────────────────────────────────────────────────────────────────────
untracked_nouns = [
  # Shared error enums
  "DomainError",

  # Message sub-types — Message itself is the tracked aggregate
  "CostInfo",
  "LlmResponse",
  "ModelPricing",
  "StopReason",
  "ThinkingBlock",
  "UsageInfo",
  "UserImageBlock",

  # Provider-layer DTOs — carried by LlmProvider port, not user-facing
  "CancelFlag",
  "ChatRequest",
  "EffortLevel",
  "RequestMetadata",
  "StreamEvent",
  "ThinkingLevel",
  "ToolChoice",

  # Audit sub-types — AuditEvent is the tracked noun
  "AuditEnvelope",
  "AuditIssue",

  # Session internals — Session aggregates these
  "OrphanDiag",
  "SpillEntry",
  "SpillIndex",

  # Skill loader plumbing
  "SkillFrontmatter",
  "SkillSource",

  # Subagent configuration value object
  "SubagentConfig",

  # Agent progress/result types — internal to agent orchestration
  "AgentInfo",
  "AgentProgressEvent",
  "AgentResult",

  # Tool plumbing
  "ImageBlock",
  "ToolDefinition",

  # Workflow engine — experimental subsystem not yet feature-driven
  "WorkflowConfig",
  "WorkflowEngine",
  "WorkflowError",
  "WorkflowGuardRule",
  "WorkflowMode",
  "WorkflowProgress",
  "WorkflowRun",
  "WorkflowRunPersisted",
  "WorkflowSnapshot",
  "WorkflowStepStatus",
  "WorkflowTemplate",
  "WorkflowTemplateStep",
  "WorkflowTemplateSummary",
]

