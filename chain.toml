# chainlink chain.toml — declared architecture exceptions.
#
# This file is part of the committed contract consumed by `chainlink scan`.
# Every entry here is an intentional opt-out: the noun/port/feature is known
# to sit outside the feature→noun→port→adapter chain and should not raise
# warnings. Review these entries whenever the domain changes.

# ────────────────────────────────────────────────────────────────────────────
# Features that describe engineering concerns rather than domain behaviour.
# TUI polish, release/build hygiene, sandbox hardening, repo docs and
# architecture-boundary tests never exercise a domain noun; they describe
# presentational or meta-level invariants.
# ────────────────────────────────────────────────────────────────────────────
non_behavioral_features = [
  # TUI presentation / polish — no domain noun involved
  "tests/features/tui_abort_pending_clear.feature",
