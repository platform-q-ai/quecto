# Library coverage is enforced with `cargo llvm-cov` by
# .github/workflows/coverage-nightly.yml (scripts/run-lib-coverage.sh), not here.
#
# tarpaulin config is kept as a fallback / CI alternative but is NOT the
# primary enforcement mechanism. llvm-cov is faster and more accurate.
[default]
run-types = ["Lib"]
out = ["Html", "Xml"]
output-dir = "target/coverage"
skip-clean = true
exclude-files = ["*/tests/*"]
fail-under = 80
