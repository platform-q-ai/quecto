# Coverage is enforced via `cargo llvm-cov` in scripts/pre-push.sh (step 6/7).
# Target: 95% line coverage for both quecto and quecto-tui.
#
# tarpaulin config is kept as a fallback / CI alternative but is NOT the
# primary enforcement mechanism. llvm-cov is faster and more accurate.
[default]
run-types = ["Lib"]
out = ["Html", "Xml"]
output-dir = "target/coverage"
skip-clean = true
exclude-files = ["*/tests/*"]
fail-under = 95
