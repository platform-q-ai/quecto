[default]
# Unit test coverage only; BDD integration tests (which cover gateway, CLI,
# voice, and web search paths) cause tarpaulin segfaults with ptrace.
# Target: 90% once tarpaulin supports cucumber-rs reliably.
fail-under = 85
run-types = ["Lib"]
out = ["Html", "Xml"]
output-dir = "target/coverage"
skip-clean = true
exclude-files = ["*/tests/*"]
