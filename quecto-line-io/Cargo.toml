[package]
name = "quecto-line-io"
version = "0.1.0"
edition = "2024"
description = "Shared bounded JSON-lines reader for quecto's UDS protocol"
license = "LicenseRef-Proprietary"

[dependencies]
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
