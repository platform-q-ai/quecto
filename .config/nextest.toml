# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# nextest runs every test in its own process and schedules across binaries,
# so the workspace `--lib --bins` set and the harness integration targets run
# in roughly half the `cargo test` wall time. CI's Workspace Tests job and the
# pre-push gate use the `ci` profile for every libtest-harness target; the
# cucumber `bdd` targets (harness = false) stay on `cargo test`'s build via
# scripts/run-bdd-shards.sh, which sharding needs. The `census` profile is the
# slow-test census (anything over 2 s is flagged SLOW).
#
#   cargo nextest run --workspace --features quecto-agentic-harness/test-support \
#       --bins --lib --profile ci
#   cargo nextest run --workspace --features quecto-agentic-harness/test-support \
#       --bins --test <integration target> --profile ci

[profile.default]
retries = 0
slow-timeout = { period = "60s" }

[profile.ci]
retries = 0
fail-fast = false
# A test still running after 60 s is reported SLOW; after 5 such periods
# (5 min, the same bound the sharded BDD lanes get) it is killed and fails.
slow-timeout = { period = "60s", terminate-after = 5 }
# Tests that launch real `quecto` or fixture children: a child still holding the
# test's stdio a moment after the test returns is reported LEAK, not failed.
leak-timeout = "500ms"
failure-output = "immediate-final"

[profile.census]
retries = 0
fail-fast = false
slow-timeout = { period = "2s" }
leak-timeout = "500ms"
failure-output = "immediate-final"

# Parent-approved B3-A exception: unchanged full 4102-revision acceptance.
# Keep the ordinary hook/CI run and assertions; all other tests retain 300s.
[[profile.ci.overrides]]
filter = 'package(=quecto-agentic-harness) & binary(=contracts) & test(=project_board_history::feature_red_export_over_4096_native_revisions_and_oid_cache_eviction_has_no_truncation)'
slow-timeout = { period = "60s", terminate-after = 20 }
