name: Authoritative Merge CI

# Full validation runs only when the merge-requested label is applied to a PR.
# workflow_dispatch remains available for explicit diagnosis.
on:
  pull_request:
    branches: [master]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: merge-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# rust-cache keys (`shared-key`) name a BUILD SHAPE, not a job, and the same
# keys are produced on every master push by cache-warm.yml. This workflow only
# runs on labelled PRs, so without that warm-up no cache ever exists in
# master's scope and every PR's first run compiles everything cold (measured:
# Coverage 180 s warm vs 343 s cold, Static Quality 58 s vs 137 s).
#   workspace    - cargo test/clippy of the workspace shape (target/)
#   coverage-lib - instrumented workspace lib build (target/llvm-cov-lib)
#   coverage-bdd - instrumented bdd builds (target/llvm-cov-<suite>)

jobs:
  # Complements branch-protection `required_conversation_resolution` with a
  # visible merge-CI check so unresolved review threads fail next to other jobs.
  review-threads-resolved:
    if: github.event_name == 'pull_request' && github.event.label.name == 'merge-requested'
    name: Review Threads Resolved
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Require all PR review threads resolved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-pr-review-threads-resolved.sh "${{ github.event.pull_request.number }}"

  static-quality:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Static Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: scripts/check-quality.sh
      - run: scripts/check-bdd-quality.sh
      - run: scripts/check-bdd-tags.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features quecto-agentic-harness/test-support -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_arguments -W clippy::too_many_lines
      # Feature unification: the harness's dev-dependency enables quecto-tui's
      # `test-harness` feature in every workspace build, so code that only the
      # headless harness uses looks live above. `cargo install --path <crate>`
      # builds each package alone with default features; check that shape too.
      - run: cargo clippy -p quecto-tui --lib --bins -- -D warnings
      - run: cargo clippy -p quecto-agentic-harness --lib --bins -- -D warnings

  workspace-tests:
    needs: [static-quality, dependency-policy]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Workspace Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: taiki-e/install-action@nextest
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          # Ubuntu names the fd-find executable `fdfind`; expose the upstream name.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fd" --version
      - name: All workspace unit and integration tests except sharded BDD targets
        # One feature unification for every invocation. Cargo resolves
        # dependency features over the packages whose targets it builds, so a
        # `-p <crate>` run, a run without `test-support`, or a bare
        # `--test <harness target>` (which builds only the harness) each
        # resolve a different feature set for tokio/reqwest/serde/... and
        # rebuild the harness library and shared deps whenever the shape
        # changes. The shape below matches `--workspace --all-targets`:
        # `--workspace` selects every member and `--bins` (five empty bin test
        # harnesses, 0.2 s) keeps every member's dev-dependencies in the
        # resolution even when the test targets belong to one crate.
        # `test-support` is additive test-only surface; the real-process
        # selected-termination target requires it (its child harness is the
        # `quecto` binary built with the test-only exit hold, #1936 review).
        # Non-harness BDD targets are named `<crate>_bdd`, so `--test <name>`
        # selects exactly one target across the workspace.
        #
        # libtest-harness targets run under cargo-nextest (one process per
        # test, scheduled across binaries; `ci` profile in .config/nextest.toml),
        # which is built from the same cargo artifacts; the cucumber `*_bdd`
        # targets (harness = false) stay on `cargo test`.
        run: |
          SHAPE=(--workspace --features quecto-agentic-harness/test-support --bins)
          # Unit tests of every crate (harness, tui, api, mcp, runtime-manager, line-io).
          cargo nextest run "${SHAPE[@]}" --lib --profile ci
          # Explicit names are retained as executable documentation and architecture guards,
          # with the harness integration targets tests/integration and tests/docs.
          cargo nextest run "${SHAPE[@]}" --test architecture --test contracts --test integration --test docs --profile ci
          # The two real-process proofs that must run apart from the other modules
          # (see quecto-agentic-harness/Cargo.toml). The architecture suite asserts
          # every harness target on disk appears in this job.
          cargo nextest run "${SHAPE[@]}" --test parent_loss --test selected_termination --profile ci
          # quecto-api and quecto-mcp BDD scenarios (their unit tests ran in the --lib pass above).
          cargo test "${SHAPE[@]}" --no-fail-fast --test api_bdd --test mcp_bdd

  non-real-bdd:
    needs: [static-quality, dependency-policy]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Non-Real BDD
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-bdd
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          # Ubuntu names the fd-find executable `fdfind`; expose the upstream name.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fd" --version
      - run: bash scripts/run-bdd-shards.sh --suite non-real-bdd --shards 8 --timeout 5m --coverage --coverage-threshold 72

  tui-bdd:
    needs: [static-quality, dependency-policy]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: TUI BDD
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-bdd
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: bash scripts/run-bdd-shards.sh --suite tui-bdd --package quecto-tui --test-target tui_bdd --shards 8 --timeout 5m --coverage --coverage-threshold 62

  mock-llm-e2e:
    needs: [static-quality, dependency-policy]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Mock LLM E2E
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: bash scripts/run-bdd-shards.sh --suite mock-llm-bdd --shards 8 --timeout 5m --tag mock-llm

  coverage:
    needs: [static-quality, dependency-policy]
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Coverage
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-lib
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          # Ubuntu names the fd-find executable `fdfind`; expose the upstream name.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fd" --version
      # One instrumented workspace-shape build; each package's lib tests run
      # and report alone (the same per-package numbers as three `cargo llvm-cov
      # --lib -p` runs, which each compiled their own feature unification).
      - run: bash scripts/run-lib-coverage.sh quecto-agentic-harness:92 quecto-tui:95 quecto-api:95

  dependency-policy:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Dependency Policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo machete
      - run: cargo deny check
