name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Unit, architecture, contract, and repository-doc tests
        run: cargo test -p quecto --lib --test architecture --test contracts --test repo_docs

      - name: TUI harness and unit tests
        run: cargo test -p quecto-tui --lib

  mock-llm-e2e:
    name: Mock LLM E2E Tests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Mock LLM BDD/e2e tests
        run: bash scripts/run-bdd-shards.sh --suite mock-llm-bdd --shards 24 --timeout 5m --tag mock-llm

  non-real-bdd:
    name: Non-Real BDD Tests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Non-real BDD tests
        run: bash scripts/run-bdd-shards.sh --suite non-real-bdd --shards 24 --timeout 5m

  provider-smoke:
    name: Provider Smoke Tests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Provider smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "Skipping provider smoke tests: no provider API key secret configured"
            exit 0
          fi
          QUECTO_PROVIDER_SMOKE=1 QUECTO_TAG=provider-smoke cargo test -p quecto --no-fail-fast --features test-support --test bdd
