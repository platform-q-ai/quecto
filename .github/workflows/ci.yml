name: Authoritative Merge CI

# Full validation runs only when the merge-requested label is applied to a PR.
# workflow_dispatch remains available for explicit diagnosis.
on:
  pull_request:
    branches: [master]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: merge-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static-quality:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Static Quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-quality.sh
      - run: scripts/check-bdd-quality.sh
      - run: scripts/check-bdd-tags.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features quecto-agentic-harness/test-support -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_arguments -W clippy::too_many_lines

  workspace-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Workspace Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: All workspace unit and integration tests except sharded BDD targets
        run: |
          cargo test --workspace --lib --bins
          mapfile -t targets < <(find quecto-agentic-harness/tests -maxdepth 1 -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort)
          args=()
          for target in "${targets[@]}"; do args+=(--test "$target"); done
          # Explicit names are retained as executable documentation and architecture guards.
          cargo test -p quecto-agentic-harness --no-fail-fast --test architecture --test contracts
          cargo test -p quecto-agentic-harness --no-fail-fast "${args[@]}"
          cargo test -p quecto-api --no-fail-fast --all-targets
          cargo test -p quecto-tui --lib

  non-real-bdd:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Non-Real BDD
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: bash scripts/run-bdd-shards.sh --suite non-real-bdd --shards 24 --timeout 5m --coverage --coverage-threshold 72

  tui-bdd:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: TUI BDD
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: bash scripts/run-bdd-shards.sh --suite tui-bdd --package quecto-tui --features test-harness --shards 8 --timeout 5m --coverage --coverage-threshold 62

  mock-llm-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Mock LLM E2E
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/run-bdd-shards.sh --suite mock-llm-bdd --shards 24 --timeout 5m --tag mock-llm

  coverage:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --lib -p quecto-agentic-harness --ignore-filename-regex '(tui_harness|test_support|warn_capture)' --fail-under-functions 93
      - run: cargo llvm-cov --lib -p quecto-tui --ignore-filename-regex '(tui_harness|test_support|warn_capture)' --fail-under-functions 95
      - run: cargo llvm-cov --lib -p quecto-api --ignore-filename-regex '(tui_harness|test_support|warn_capture)' --fail-under-functions 95

  dependency-policy:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'merge-requested'
    name: Dependency Policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo machete
      - run: cargo deny check
