name: Mutation Testing

# Mutation testing of the lines a PR changes, on the same trigger as the
# authoritative merge CI (ci.yml): it runs only when the `merge-requested`
# label is applied. `cargo mutants --in-diff` mutates only code the PR's diff
# touches; each mutant is a rebuild plus a test run, which is why this runs
# on CI runners and never on a workstation.
#
#   plan   - diff the PR against its base and list the mutants (listing does
#            not build). No mutants (empty diff, docs-only, tests-only) ends
#            here: the shards are skipped and the report passes.
#   shard  - one runner per shard, `--shard k/N`; N is one shard per 4
#            mutants, at most 16. A diff with more than 64 mutants still runs
#            (more mutants per shard, longer step timeout) and its summary
#            says it is oversize.
#   report - "Mutation Testing (diff)": one summary over every shard; fails
#            when any mutant was MISSED or TIMEOUT, or any shard did not
#            finish. It always runs and fails in any run that is not a
#            `merge-requested` labelling (another label, a push), so it is
#            never skipped: GitHub counts a skipped required check as passing.
#
# Advisory: "Mutation Testing (diff)" is not a required status check, and
# making it one is a branch-protection decision for the repository owner.
#
# Configuration (test targets, excluded test-support files) lives in
# .cargo/mutants.toml; timeouts are set below.
on:
  pull_request:
    branches: [master]
    # `synchronize` cancels: a push removes `merge-requested`
    # (reset-merge-requested.yml) and the run for the old head must stop. Its
    # own run skips the plan and shards, and its report fails the new head
    # until `merge-requested` is applied again.
    types: [labeled, synchronize]

# One group per PR and label: adding some other label never cancels a
# mutation run, while re-applying `merge-requested` or pushing (which joins
# the `merge-requested` group) cancels the run in progress.
concurrency:
  group: mutation-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'merge-requested' || github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    if: github.event.action == 'labeled' && github.event.label.name == 'merge-requested'
    name: Mutation Plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      count: ${{ steps.list.outputs.count }}
      total: ${{ steps.list.outputs.total }}
      shards: ${{ steps.list.outputs.shards }}
      oversize: ${{ steps.list.outputs.oversize }}
      step_minutes: ${{ steps.list.outputs.step_minutes }}
      job_minutes: ${{ steps.list.outputs.job_minutes }}
    steps:
      # Full history: the diff is taken from the merge base with the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Diff the PR and list its mutants
        id: list
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-plan
          # HEAD is the PR merged into its base (the tree the shards test), so
          # the diff's line numbers are that tree's.
          git diff "origin/${BASE_REF}...HEAD" > mutation-plan/pr.diff
          if [[ -s mutation-plan/pr.diff ]]; then
            cargo mutants --list --json --in-diff mutation-plan/pr.diff > mutation-plan/mutants.json
          else
            : > mutation-plan/mutants.json
          fi
          # cargo-mutants prints nothing at all (not `[]`) when the diff
          # changes no mutable Rust code.
          if [[ -s mutation-plan/mutants.json ]]; then
            count="$(jq length mutation-plan/mutants.json)"
          else
            count=0
          fi
          if [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "$count mutants in the diff"
          else
            echo "error: mutant count is not a number: $count" >&2
            exit 1
          fi
          # Sizing. A mutant costs roughly 8-12 min on a 4-vcpu runner (an
          # incremental workspace build plus the libtest run); the shard step
          # budgets 25 min per mutant (up to the 1500 s build and 900 s test
          # timeouts) plus 30 min for the first build of the workspace crates.
          per_shard=4
          max_shards=16
          total=$(( (count + per_shard - 1) / per_shard ))
          if (( total > max_shards )); then
            total=$max_shards
          fi
          if (( total > 0 )); then
            most=$(( (count + total - 1) / total ))
          else
            most=0
          fi
          # GitHub's job limit is 360 min; beyond 12 mutants a shard (a diff
          # of more than 192) the budget is capped and the slowest shards may
          # not finish, which the report job reports as incomplete.
          step_minutes=$(( 30 + most * 25 ))
          if (( step_minutes > 330 )); then
            step_minutes=330
          fi
          job_minutes=$(( step_minutes + 20 ))
          if (( count > per_shard * max_shards )); then
            oversize=true
          else
            oversize=false
          fi
          shards="$(jq -nc --argjson n "$total" '[range(0; $n)]')"
          {
            echo "count=$count"
            echo "total=$total"
            echo "shards=$shards"
            echo "oversize=$oversize"
            echo "step_minutes=$step_minutes"
            echo "job_minutes=$job_minutes"
          } >> "$GITHUB_OUTPUT"
          echo "$total shard(s), at most $most mutants each, step budget ${step_minutes} min"
          if [[ "$oversize" == "true" ]]; then
            echo "Oversize: $count mutants is more than $(( per_shard * max_shards )) ($max_shards shards of $per_shard); shards run up to $most each." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if (( count > 0 )); then
            jq -r '.[].name' mutation-plan/mutants.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-plan
          path: mutation-plan/
          retention-days: 14

  shard:
    needs: plan
    if: fromJSON(needs.plan.outputs.count || '0') > 0
    name: Mutation Shard ${{ matrix.shard }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies built in the Workspace Tests shape (see
      # .cargo/mutants.toml), restored from the entry cache-warm.yml saves;
      # rust-cache does not keep the workspace crates, so the first mutant
      # builds those. Not saved back: the shards would race to save the same
      # key and a mutated build is not worth caching.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          # Ubuntu names the fd-find executable `fdfind`; expose the upstream name.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fd" --version
      - uses: actions/download-artifact@v4
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan
      - name: Mutants of shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
        # Below the job timeout, so the summary and upload still run with the
        # outcomes recorded so far.
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_minutes) }}
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.plan.outputs.total }}
          DIFF: ${{ runner.temp }}/mutation-plan/pr.diff
          # Tests that would abort do not dump core (the harness's test
          # switch; harmless where it is not read yet).
          QUECTO_TEST_NO_CORE_DUMPS: "1"
          # One retry of a failing test, for flake tolerance. A test that
          # fails under a mutant and passes on retry counts as passing, so
          # that mutant is reported MISSED, never falsely caught.
          NEXTEST_RETRIES: "1"
        run: |
          # The step shell runs with -e; the exit code is judged below.
          set +e
          set -uo pipefail
          # A mutant that makes a test abort must not write core files.
          ulimit -c 0
          # --in-place: the runner is disposable, so mutate the checkout and
          # build into its target/ (restored dependencies included) instead
          # of copying the tree into a scratch directory.
          # --baseline=skip: ci.yml's Workspace Tests prove the unmutated
          # tests pass, so the timeouts are explicit rather than a multiple
          # of a baseline run. Test targets and test tool come from
          # .cargo/mutants.toml.
          cargo mutants \
            --in-place \
            --in-diff "$DIFF" \
            --shard "${SHARD}/${TOTAL}" \
            --sharding round-robin \
            --no-shuffle \
            --baseline=skip \
            --timeout 900 \
            --build-timeout 1500 \
            --colors never
          rc=$?
          # cargo-mutants exit codes: 0 every mutant caught, 2 some missed,
          # 3 some timed out. The report job judges those (both fail it);
          # anything else (usage error, a crash) fails this shard.
          case "$rc" in
            0|2|3) exit 0 ;;
            *)
              echo "error: cargo mutants exited $rc" >&2
              exit "$rc"
              ;;
          esac
      - name: Shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.plan.outputs.total }}
        run: |
          if [[ -f mutants.out/outcomes.json ]]; then
            bash scripts/mutants-summary.sh "Mutation shard ${SHARD}/${TOTAL}" mutants.out >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mutation shard ${SHARD}/${TOTAL}: no outcomes were recorded." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [plan, shard]
    # Always runs, so the check is never skipped: GitHub counts a skipped
    # required check as passing. In a run that is not a `merge-requested`
    # labelling (another label, a push) or whose plan or shards did not
    # finish (cancelled, failed), it fails, so a head SHA shows a passing
    # "Mutation Testing (diff)" only when mutation testing ran on it and
    # passed.
    if: always()
    name: Mutation Testing (diff)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Ran for merge-requested
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [[ "$ACTION" == "labeled" && "$LABEL" == "merge-requested" ]]; then
            exit 0
          fi
          {
            echo "## Mutation Testing (diff)"
            echo
            echo "Not run for this event (\`$ACTION\`${LABEL:+ \`$LABEL\`}): mutation testing runs when \`merge-requested\` is applied. Apply it to test this head."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "error: not a merge-requested labelling ($ACTION ${LABEL:-}); mutation testing did not run for this event" >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Planning succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          if [[ "$PLAN_RESULT" == "success" ]]; then
            exit 0
          fi
          echo "error: mutation planning ended as '$PLAN_RESULT'" >&2
          exit 1
      - name: No mutants in the diff
        if: needs.plan.outputs.count == '0'
        run: |
          {
            echo "## Mutation Testing (diff)"
            echo
            echo "The PR's diff changes no mutable Rust code (empty, docs-only or test-only): nothing to mutate."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: fromJSON(needs.plan.outputs.count || '0') > 0
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Combine shards
        if: fromJSON(needs.plan.outputs.count || '0') > 0
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          TOTAL: ${{ needs.plan.outputs.total }}
          COUNT: ${{ needs.plan.outputs.count }}
          OVERSIZE: ${{ needs.plan.outputs.oversize }}
        run: |
          set -euo pipefail
          dirs=()
          missing=()
          classified=0
          for (( k = 0; k < TOTAL; k++ )); do
            dir="shards/mutants-shard-$k"
            if [[ -f "$dir/outcomes.json" ]]; then
              dirs+=("$dir")
              # Mutants the shard tested AND classified. `total_mutants` also
              # counts a mutant whose test run died unclassified (e.g. killed
              # by a signal), so it is not used.
              n="$(jq '.caught + .missed + .timeout + .unviable' "$dir/outcomes.json")"
              if [[ "$n" =~ ^[0-9]+$ ]]; then
                classified=$(( classified + n ))
              else
                echo "error: shard $k outcomes.json lacks numeric caught/missed/timeout/unviable counts: $n" >&2
                exit 1
              fi
            else
              missing+=("$k")
            fi
          done
          status=0
          {
            if (( ${#dirs[@]} > 0 )); then
              bash scripts/mutants-summary.sh --fail-on-uncaught \
                "Mutation Testing (diff): $classified of $COUNT mutants classified over $TOTAL shard(s)" "${dirs[@]}" || status=$?
            else
              echo "## Mutation Testing (diff)"
              echo
            fi
            if [[ "$OVERSIZE" == "true" ]]; then
              echo
              echo "**Oversize:** $COUNT mutants is more than 64 (16 shards of 4), so each shard tested more than 4."
            fi
            if (( ${#missing[@]} > 0 )); then
              echo
              echo "**Incomplete:** no outcomes from shard(s) ${missing[*]}."
            fi
            if (( classified == COUNT )); then
              :
            else
              echo
              echo "**Incomplete:** $classified of the $COUNT planned mutants were tested and classified (caught, missed, timeout or unviable)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # Pass only when every shard succeeded and reported, every planned
          # mutant was classified, and none was MISSED or timed out.
          if [[ "$SHARD_RESULT" == "success" && ${#missing[@]} -eq 0 && "$classified" -eq "$COUNT" && "$status" -eq 0 ]]; then
            exit 0
          fi
          echo "error: shards ended as '$SHARD_RESULT'; shards without outcomes: '${missing[*]}'; classified $classified of $COUNT; summary status $status (1 = mutants MISSED or TIMEOUT, listed in the job summary)" >&2
          exit 1
