name: E2E (real LLM)

# Real-LLM end-to-end tests make billable API calls, so this is NOT part of the
# per-PR gate. Trigger it manually (Actions → "E2E (real LLM)" → Run workflow)
# or on the weekly schedule below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   OPENAI_API_KEY      — runs the OpenAI scenarios (gpt-5.2 / gpt-5.4). Required.
#   ANTHROPIC_API_KEY   — optional; enables the Anthropic scenarios
#                         (tests/features/e2e_real_llm_uds.feature). Without it,
#                         those scenarios are skipped so the run stays green.
#
# CI runners have no ChatGPT OAuth credential, so a bare `--model gpt-5.2`
# uses the API key directly (no Codex routing) — no disable_codex_routing needed.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: e2e-real-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-llm:
    name: Real-LLM e2e
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      # quecto reads QUECTO_PROVIDERS_*; the runner's presence-gate reads OPENAI_API_KEY.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUECTO_PROVIDERS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QUECTO_PROVIDERS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Require an OpenAI key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set — add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Exclude Anthropic scenarios when no Anthropic key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY not set — excluding the Anthropic e2e feature (uds)."
            mv tests/features/e2e_real_llm_uds.feature /tmp/e2e_real_llm_uds.feature.hold
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Real-LLM end-to-end suite (sharded)
        run: |
          QUECTO_REAL_LLM=1 bash scripts/run-bdd-shards.sh \
            --suite real-llm-bdd --shards 8 --timeout 600 --tag real-llm --real-llm
