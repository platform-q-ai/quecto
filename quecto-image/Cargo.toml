[package]
name = "quecto-image"
version = "0.1.0"
edition = "2024"
description = "Validated image attachments shared by quecto's UDS protocol peers"
license = "LicenseRef-Proprietary"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
# Real minimal image files (`quecto_image::samples`) for other crates' tests.
test-support = []
