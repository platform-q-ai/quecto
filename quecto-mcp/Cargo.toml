[package]
name = "quecto-mcp"
version = "0.2.0"
edition = "2024"
description = "MCP client UDS extension for Quecto"
license = "LicenseRef-Proprietary"

[dependencies]
quecto-fail-fast = { version = "0.1.0", path = "../quecto-fail-fast" }
quecto-image = { version = "0.1.0", path = "../quecto-image" }
quecto-line-io = { version = "0.2.1", path = "../quecto-line-io" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
shlex = "1"

[dev-dependencies]
quecto-image = { version = "0.1.0", path = "../quecto-image", features = ["test-support"] }
cucumber = { version = "0.21", features = ["macros"] }
tempfile = "3"
wiremock = "0.6"

# Named `mcp_bdd` so `cargo test --workspace --test bdd` selects only the
# harness BDD runner (one workspace feature unification).
[[test]]
name = "mcp_bdd"
path = "tests/bdd/main.rs"
harness = false
