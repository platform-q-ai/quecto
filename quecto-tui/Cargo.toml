[package]
name = "quecto-tui"
version = "0.70.34"
edition = "2024"
description = "Lightweight terminal UI client for quecto"
license = "LicenseRef-Proprietary"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
# Exposes the headless render harness (`shell::app::tui_harness`) and a few
# read-only App accessors to integration tests in the workspace `bdd` target so
# they can drive the real render/key path without a TTY (#805).
test-harness = []

[dependencies]
# Async runtime — UDS client + stdin reader
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "io-util", "io-std", "sync", "net"] }

# Serialization — framed JSON UDS protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quecto-line-io = { version = "0.2.0", path = "../quecto-line-io" }

# Warn-log dropped oversized inbound frames (#1112). The TUI installs no
# subscriber itself — events are no-ops unless an embedder/test installs one,
# so the raw-mode terminal stays clean (no-stderr policy).
tracing = "0.1"

# Unicode width calculation (no other terminal crate)
unicode-width = "0.2"

# Markdown parsing (lightweight, event-based, pure Rust)
pulldown-cmark = { version = "0.13", default-features = false }

# Low-level terminal control (termios, ioctl) — no higher-level crate needed
libc = "0.2"

[dev-dependencies]
cucumber = "0.21"
futures = "0.3"
regex = "1"
tempfile = "3"
# `test-util` enables tokio's paused-clock test helpers (`time::pause`/`advance`)
# so timer tests can drive a deterministic clock instead of wall time (#838).
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "bdd"
harness = false
required-features = ["test-harness"]
