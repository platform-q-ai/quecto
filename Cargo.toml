[package]
name = "quecto"
version = "0.15.0"
edition = "2024"
description = "Ultra-lightweight personal AI assistant"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "io-std", "sync"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dirs = "6"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
similar = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1"
tar = "0.4"

[features]
default = []
test-support = []

[dev-dependencies]
cucumber = "0.21"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
wiremock = "0.6"
regex = "1"

[[test]]
name = "bdd"
harness = false
