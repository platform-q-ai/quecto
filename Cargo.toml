[workspace]
resolver = "3"
members = [
    "quecto-agentic-harness",
    "quecto-tui",
    "quecto-api",
    "quecto-mcp",
    "quecto-runtime-manager",
    "quecto-line-io",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Debug info for `cargo build`/`cargo test` (the `test` profile inherits `dev`):
# line tables only. Panic backtraces and `#[track_caller]` locations keep
# file:line, while the variable/type DWARF that only a debugger uses is not
# emitted. Measured cold `cargo test --workspace --all-targets --no-run`:
# 231 s -> 172 s; warm one-file recompile 38 s -> 24 s; target dir 22 GB -> 12 GB.
# `debug = 0` is only ~15 s faster cold and loses line numbers in backtraces.
# Overflow checks and debug assertions stay at their dev defaults (on).
# For a debugger session, override once: CARGO_PROFILE_DEV_DEBUG=2 cargo build.
[profile.dev]
debug = "line-tables-only"

# The harness fingerprints its own executable (sha256 of /proc/self/exe,
# infrastructure/runtime_identity.rs) once per process. A debug test binary
# is 200-500 MB and sha2 at opt-level 0 hashes it at ~30 MB/s: 10-17 s of CPU
# per BDD shard or nextest process, charged to whatever tests run meanwhile.
# Optimising just the hashing crates makes that ~1 s; they are small, so the
# cold build cost is negligible.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
