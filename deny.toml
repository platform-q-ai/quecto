[graph]
all-features = true

[advisories]
ignore = []

[licenses]
exceptions = [
    # Workspace-internal proprietary crates. After the #908 monorepo refactor the
    # repo root is a pure workspace, so `cargo deny` checks every member's graph
    # (not just the old root crate's), surfacing the sibling crates below.
    { allow = ["LicenseRef-Proprietary"], crate = "quecto" },
    { allow = ["LicenseRef-Proprietary"], crate = "quecto-tui" },
    { allow = ["LicenseRef-Proprietary"], crate = "quecto-api" },
    { allow = ["LicenseRef-Proprietary"], crate = "quecto-mcp" },
    { allow = ["LicenseRef-Proprietary"], crate = "quecto-runtime-manager" },
]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
