[graph]
all-features = true

[advisories]
ignore = [
    # wasmtime 34.x advisories — upgrade tracked separately
    "RUSTSEC-2025-0057",  # fxhash unmaintained (transitive via wasmtime)
    "RUSTSEC-2025-0118",  # wasmtime shared memory unsoundness
    "RUSTSEC-2026-0006",  # wasmtime f64.copysign segfault
    "RUSTSEC-2026-0020",  # wasmtime WASI resource exhaustion
    "RUSTSEC-2026-0021",  # wasmtime wasi:http/types.fields panic
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
